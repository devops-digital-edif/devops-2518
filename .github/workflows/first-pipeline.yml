name: First Workflow
on: workflow_dispatch  # trigger -used to on which event you want to run this workflow
jobs:
  build:
    runs-on: ubuntu-latest # windows-latest, macos-latest - runners, managed by github
    steps:
      - name: call vars
        run: echo "the trainer name is $TRAINER"
      - name: calling repo variable
        run: echo "the username is ${{vars.MY_USERNAME}}"
      - name: call repo secret
        run: echo "the password is ${{secrets.MY_PASSWORD}}"
      - name: Docker Login
        uses: docker/login-action@v3.6.0
        with:
          username: ${{vars.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
